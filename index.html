<!doctype html>
<html lang="en" data-theme="flat">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A daily logic puzzle: one mine per row, column and color. Never a guess.">
  <meta name="theme-color" content="#fbf8f3">
  <title>Minewseeper</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/themes.css">
  <!-- Saved theme before first paint (key and values as in js/storage.js); app.js re-applies it. -->
  <script>try { var t = JSON.parse(localStorage.getItem('mws.settings')).theme; if (t === 'pixel' || t === 'candy') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flat-flag" viewBox="0 0 24 24"><path d="M7 3v18" stroke="#333" stroke-width="2" stroke-linecap="round"/><path d="M8 4h10l-3 4 3 4H8z" fill="#e5484d"/></symbol>
    <symbol id="flat-mine" viewBox="0 0 24 24"><g stroke="#222" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></g><circle cx="12" cy="12" r="6" fill="#222"/><circle cx="10" cy="10" r="1.6" fill="#fff"/></symbol>
    <symbol id="flat-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="currentColor"/></symbol>
    <symbol id="pixel-flag" viewBox="0 0 13 13" shape-rendering="crispEdges"><g fill="#e00"><rect x="5" y="1" width="2" height="1"/><rect x="3" y="2" width="4" height="1"/><rect x="2" y="3" width="5" height="1"/><rect x="3" y="4" width="4" height="1"/><rect x="5" y="5" width="2" height="1"/></g><g fill="#000"><rect x="7" y="1" width="1" height="8"/><rect x="5" y="8" width="5" height="1"/><rect x="3" y="9" width="9" height="2"/></g></symbol>
    <symbol id="pixel-mine" viewBox="0 0 13 13" shape-rendering="crispEdges"><g fill="#000"><rect x="6" y="0" width="1" height="13"/><rect x="0" y="6" width="13" height="1"/><rect x="3" y="3" width="7" height="7"/><rect x="4" y="2" width="5" height="9"/><rect x="2" y="4" width="9" height="5"/><rect x="2" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="2" y="10" width="1" height="1"/><rect x="10" y="10" width="1" height="1"/></g><rect x="4" y="4" width="2" height="2" fill="#fff"/></symbol>
    <symbol id="pixel-heart" viewBox="0 0 7 6" shape-rendering="crispEdges"><g fill="currentColor"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></symbol>
    <defs>
      <radialGradient id="candy-g-bomb" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#5a5a72"/><stop offset="1" stop-color="#1c1c28"/></radialGradient>
      <linearGradient id="candy-g-heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a93"/><stop offset="1" stop-color="#e0244a"/></linearGradient>
    </defs>
    <symbol id="candy-flag" viewBox="0 0 24 24"><ellipse cx="7" cy="21.5" rx="5" ry="1.5" fill="rgba(0,0,0,.2)"/><rect x="5.5" y="3" width="2.6" height="18.5" rx="1.3" fill="#7a5a40"/><path d="M8 4.5q5-2.5 11 .5v8q-5.5-3-11-.5z" fill="#ff4d6d"/><path d="M8 4.5q5-2.5 11 .5v2q-5.5-2.5-11-.5z" fill="#fff" opacity=".35"/></symbol>
    <symbol id="candy-mine" viewBox="0 0 26 26"><circle cx="11" cy="15" r="8.5" fill="url(#candy-g-bomb)"/><rect x="13.5" y="4.5" width="5" height="4" rx="1" fill="#444" transform="rotate(40 16 6.5)"/><path d="M18 5q2.5-3 5-1.5" stroke="#b07a4a" stroke-width="1.5" fill="none"/><circle cx="23" cy="3.5" r="2.2" fill="#ffc400"/><ellipse cx="8" cy="12" rx="2.5" ry="1.6" fill="#fff" opacity=".45"/></symbol>
    <symbol id="candy-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="url(#candy-g-heart)"/><ellipse cx="7.5" cy="9.5" rx="2.2" ry="1.4" fill="#fff" opacity=".6"/></symbol>
    <symbol id="candy-burst" viewBox="0 0 24 24"><polygon points="12,1 14.5,8 22,6 17,12 22,18 14.5,16 12,23 9.5,16 2,18 7,12 2,6 9.5,8" fill="#ffb02e"/><polygon points="12,5 13.6,9.6 18,8.5 15,12 18,15.5 13.6,14.4 12,19 10.4,14.4 6,15.5 9,12 6,8.5 10.4,9.6" fill="#ffe066"/></symbol>
  </svg>

  <main>
    <section id="home">
      <h1 class="logo"><svg aria-hidden="true"><use href="#flat-mine"/></svg>Minewseeper</h1>

      <article class="card">
        <div class="card-head">
          <h2>Daily puzzle</h2>
          <span class="pill" id="daily-streak" title="Daily streak">🔥 0</span>
        </div>
        <p class="muted" id="daily-date"></p>
        <p class="daily-result" id="daily-result" hidden></p>
        <button class="btn" id="daily-play" type="button">Play today's board</button>
      </article>

      <article class="card">
        <h2>Arena</h2>
        <p class="muted">Endless random boards</p>
        <button class="btn alt" id="arena-play" type="button">New board</button>
      </article>

      <div class="totals">
        <div><b id="total-played">0</b>played</div>
        <div><b id="total-won">0</b>wins</div>
        <div><b id="total-flawless">0</b>flawless</div>
      </div>

      <div class="themes" id="themes" role="group" aria-label="Theme">
        <button class="theme-opt" type="button" data-theme="flat" aria-pressed="true">
          <span class="pv" aria-hidden="true"><i style="background-color:var(--c0)"><svg><use href="#flat-flag"/></svg></i><i style="background-color:var(--c4)"></i><i style="background-color:var(--c1)"></i><i style="background-color:var(--c3)"><svg><use href="#flat-mine"/></svg></i></span>
          Flat
        </button>
        <button class="theme-opt" type="button" data-theme="pixel" aria-pressed="false">
          <span class="pv" aria-hidden="true"><i style="background-color:var(--c0)"><svg><use href="#pixel-flag"/></svg></i><i style="background-color:var(--c4)"></i><i style="background-color:var(--c1)"></i><i style="background-color:var(--c3)"><svg><use href="#pixel-mine"/></svg></i></span>
          Pixel
        </button>
        <button class="theme-opt" type="button" data-theme="candy" aria-pressed="false">
          <span class="pv" aria-hidden="true"><i style="background-color:var(--c0)"><svg><use href="#candy-flag"/></svg></i><i style="background-color:var(--c4)"></i><i style="background-color:var(--c1)"></i><i style="background-color:var(--c3)"><svg><use href="#candy-mine"/></svg></i></span>
          Candy
        </button>
      </div>

      <button class="btn ghost" id="how-to" type="button">How to play</button>
    </section>

    <section id="play" hidden>
      <header class="bar">
        <button class="back" id="back" type="button" aria-label="Back to home">&larr;</button>
        <span class="mode" id="mode-label"></span>
        <span class="hearts" id="hearts" role="img"></span>
        <button class="back snd" id="sound" type="button" aria-label="Sound" aria-pressed="true">🔊</button>
      </header>
      <div class="sub">
        <span id="found"></span>
        <button class="hint-btn" id="hint-btn" type="button">💡 Hint</button>
        <span id="timer"></span>
      </div>
      <div class="board" id="board"></div>
      <p class="hint" id="tip">Tap = safe &middot; Double tap = mine</p>
    </section>

    <section id="result" hidden>
      <div class="banner" id="banner"></div>
      <p class="sub center" id="result-label"></p>
      <div class="board small done" id="result-board" inert></div>
      <div class="totals">
        <div><b id="result-time">0:00</b>time</div>
        <div><b class="hearts" id="result-lives" role="img"></b>lives</div>
        <div id="result-streak-box"><b id="result-streak">🔥 0</b>day streak</div>
      </div>
      <button class="btn" id="share" type="button">Share result</button>
      <button class="btn alt" id="again" type="button">New arena board</button>
      <button class="btn ghost" id="to-home" type="button">Home</button>
    </section>

    <section id="tutorial" hidden></section>
  </main>

  <div class="loading" id="loading" role="status" hidden>Shuffling mines…</div>
</body>
</html>
